<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hiddie</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><img src="assets/icon.png" alt="Hiddie"><span>hiddie</span></a><div class="languages"><button data-lang="pl">PL</button><button data-lang="en">EN</button></div></header><main class="legal"><a id="back" href="index.html"></a><h1></h1><time datetime="2026-10-27"></time><div id="sections"></div></main><footer><a id="other"></a><a href="mailto:mlynarski.mateusz@gmail.com">mlynarski.mateusz@gmail.com</a></footer><script>const data={"pl": {"title": "Polityka prywatności", "sections": [["Aplikacja i ta strona", "Ta polityka opisuje Hiddie na macOS oraz demonstrację na stronie. Twórcą aplikacji i administratorem danych przekazywanych w korespondencji jest Mateusz Młynarski, działający jako osoba fizyczna. Kontakt w sprawach prywatności: <a href=\"mailto:mlynarski.mateusz@gmail.com\">mlynarski.mateusz@gmail.com</a>. Treść wybrana w aplikacji pozostaje na Twoim Macu. Nie jest przekazywana twórcy."], ["Przetwarzanie lokalne", "Hiddie przetwarza wyłącznie tekst, pliki i dane schowka wskazane przez użytkownika. Aplikacja nie ma kont użytkowników, reklam, analityki ani mechanizmów śledzenia. Nie skanuje całego ekranu i nie wysyła treści do chmury."], ["Ukryte fragmenty tekstu", "Oryginalny tekst jest zapisywany w lokalnym Pęku kluczy macOS. Odczyt wymaga uwierzytelnienia systemowego. Wpisy nie są synchronizowane przez Hiddie i nie mają automatycznego terminu wygaśnięcia. Znacznik jest identyfikatorem wpisu, a nie kopią tekstu. Aplikacja nie oferuje eksportu, zarządzania ani odzyskiwania wpisów. Utrata dostępu do lokalnego Pęku kluczy może oznaczać utratę dostępu do tekstu. Odinstalowanie aplikacji nie stanowi potwierdzenia usunięcia wszystkich wpisów Pęku kluczy."], ["Obrazy i PDF", "Hiddie odczytuje wybrany dokument i zapisuje zakrytą kopię w lokalizacji wybranej w systemowym oknie zapisu. Oryginał pozostaje bez zmian. Obrazy są eksportowane do PNG. PDF jest spłaszczany do obrazów stron, przez co traci zaznaczalny tekst, formularze, załączniki i podpisy cyfrowe. Użytkownik sam decyduje o dalszym przechowywaniu i udostępnianiu kopii."], ["Schowek, historia i ustawienia", "Dostęp do schowka wynika z wybranej przez użytkownika czynności, na przykład kopiowania lub zakrywania obrazu ze schowka. Ręcznie skopiowany odsłonięty tekst jest czyszczony po 30 sekundach, jeśli schowek nie został zmieniony. Menedżery schowka mogą zachowywać własne kopie. Hiddie nie usuwa oryginałów z historii dokumentów, funkcji Cofnij, kopii zapasowych lub synchronizacji innych aplikacji. Potwierdzenie zasad lokalnego przechowywania i ukończenie wprowadzenia są zapisywane w lokalnym kontenerze aplikacji."], ["Demo i infrastruktura strony", "Demo działa w przeglądarce i nie używa Pęku kluczy ani uwierzytelniania macOS. Wprowadzony tekst pozostaje w pamięci strony do resetu, przeładowania lub zamknięcia karty. Demo nie zapisuje tekstu w cookies ani localStorage i nie wysyła go do serwera. Pobierany PNG powstaje w przeglądarce z fikcyjnego dokumentu. Nie wpisuj prawdziwych sekretów. Strona nie dodaje własnych narzędzi analitycznych ani reklamowych. Dostawca hostingu może przetwarzać adres IP, dane żądania i dane techniczne niezbędne do dostarczenia strony oraz zabezpieczenia infrastruktury, a prywatny podgląd może wymagać logowania dostawcy. Zasady dostawcy: <a href=\"https://openai.com/policies/privacy-policy/\">OpenAI Privacy Policy</a>."], ["Kontakt i dane korespondencyjne", "Wysyłając email dobrowolnie przekazujesz adres email, treść i ewentualne załączniki. Są wykorzystywane do obsługi pytania, wsparcia i ustalenia lub obrony roszczeń, na podstawie prawnie uzasadnionego interesu w prowadzeniu korespondencji i zapewnianiu wsparcia. Dostawca poczty uczestniczy w obsłudze wiadomości. Korespondencja jest przechowywana przez czas potrzebny do załatwienia sprawy i ewentualnych obowiązków prawnych lub roszczeń. Nie przesyłaj haseł ani poufnych plików. Twórca nie ma dostępu do lokalnych wpisów Hiddie i nie może ich odzyskać."], ["Twoje prawa", "W odniesieniu do danych przekazanych w korespondencji możesz, w zakresie wynikającym z przepisów, żądać dostępu, sprostowania, usunięcia, ograniczenia przetwarzania i wnieść sprzeciw. Prawo do przenoszenia danych przysługuje w przypadkach przewidzianych prawem. Żądanie wyślij na adres kontaktowy. Możesz złożyć skargę do właściwego organu nadzorczego, w Polsce do Prezesa UODO. Dane przechowywane wyłącznie na Twoim Macu nie są dostępne twórcy."], ["Zakupy i zmiany", "Ta strona nie przyjmuje płatności. Po udostępnieniu aplikacji transakcje w sklepie będą obsługiwane przez Apple na jego zasadach; Hiddie nie pobiera danych karty płatniczej. Zmiany polityki będą publikowane tutaj z nową datą. Zmiana tekstu polityki sama w sobie nie rozszerza funkcji aplikacji."]]}, "en": {"title": "Privacy policy", "sections": [["The app and this website", "This policy covers Hiddie for macOS and the website demonstration. The app developer and controller of personal data provided in correspondence is Mateusz Młynarski, acting as an individual. Privacy contact: <a href=\"mailto:mlynarski.mateusz@gmail.com\">mlynarski.mateusz@gmail.com</a>. Content selected in the app stays on your Mac and is not sent to the developer."], ["Local processing", "Hiddie processes text, files and clipboard data explicitly selected by the user. The app has no user accounts, advertising, analytics or tracking. It does not scan the entire screen or upload content to the cloud."], ["Hidden text", "Original text is stored in local macOS Keychain. Reading it requires system authentication. Hiddie does not synchronize entries or automatically expire them. A marker identifies an entry and is not a copy of the text. Entry export, management and recovery are not available. Losing access to local Keychain may mean losing access to the text. Uninstalling Hiddie does not confirm that all Keychain entries were deleted."], ["Images and PDFs", "Hiddie reads the selected document and writes a redacted copy to the location chosen in the system save dialog. The original stays unchanged. Images export as PNG. PDFs are flattened into page images, losing selectable text, forms, attachments and digital signatures. You control subsequent storage and sharing of exported files."], ["Clipboard, history and preferences", "Clipboard access follows an explicit action, such as copying or redacting a clipboard image. Manually copied revealed text is cleared after 30 seconds if the clipboard has not changed. Clipboard managers may retain their own copies. Hiddie does not remove originals from document history, Undo, backups or other apps’ synchronization. The local storage acknowledgement and introduction completion are saved in the app’s local container."], ["Demo and website infrastructure", "The browser demo does not use Keychain or macOS authentication. Entered text remains in page memory until reset, reload or tab closure. The demo does not save it in cookies or localStorage and does not send it to a server. Sample PNG downloads are generated in the browser from a fictional document. Do not enter real secrets. The website adds no analytics or advertising tools of its own. The hosting provider may process IP addresses, request details and technical data needed to deliver and secure the site; a private preview may require provider sign in. Provider policy: <a href=\"https://openai.com/policies/privacy-policy/\">OpenAI Privacy Policy</a>."], ["Support correspondence", "Sending an email voluntarily provides your email address, message and any attachments. These are used to answer questions, provide support and establish or defend legal claims, based on the legitimate interest in handling correspondence and providing support. The email provider participates in message handling. Correspondence is retained as long as needed for the matter and any applicable legal obligations or claims. Do not send passwords or confidential files. The developer cannot access or recover your local Hiddie entries."], ["Your rights", "For correspondence data, you may request access, correction, deletion or restriction and object to processing where applicable under law. Data portability applies where its legal conditions are met. Send requests to the contact address. You may complain to the relevant supervisory authority, including the President of UODO in Poland. Data stored only on your Mac is not accessible to the developer."], ["Purchases and changes", "This website does not take payments. Once the app is available, store transactions will be handled by Apple under its policies; Hiddie does not collect payment card details. Policy updates will appear here with a new date. A policy update alone does not expand the app’s functionality."]]}};let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'pl';function render(){const d=data[lang];document.documentElement.lang=lang;document.title=d.title+' · Hiddie';document.querySelector('h1').textContent=d.title;document.querySelector('time').textContent=lang==='pl'?'Aktualizacja: 27 października 2026':'Updated: 27 October 2026';document.querySelector('#sections').innerHTML=d.sections.map(([t,p])=>'<section><h2>'+t+'</h2><p>'+p+'</p></section>').join('');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelector('#back').textContent=lang==='pl'?'← Strona Hiddie':'← Hiddie website';document.querySelector('#back').href='index.html?lang='+lang;document.querySelector('.brand').href='index.html?lang='+lang;const other=document.querySelector('#other');other.href='terms.html?lang='+lang;other.textContent=lang==='pl'?'Warunki użytkowania':'Terms of use';}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;history.replaceState(null,'','?lang='+lang);render()});render();</script></body></html>
