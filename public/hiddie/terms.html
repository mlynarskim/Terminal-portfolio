<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hiddie</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><img src="assets/icon.png" alt="Hiddie"><span>hiddie</span></a><div class="languages"><button data-lang="pl">PL</button><button data-lang="en">EN</button></div></header><main class="legal"><a id="back" href="index.html"></a><h1></h1><time datetime="2026-10-27"></time><div id="sections"></div></main><footer><a id="other"></a><a href="mailto:mlynarski.mateusz@gmail.com">mlynarski.mateusz@gmail.com</a></footer><script>const data={"pl": {"title": "Warunki użytkowania", "sections": [["Zakres", "Warunki opisują korzystanie z Hiddie na macOS i demo w przeglądarce. Twórcą aplikacji jest Mateusz Młynarski, działający jako osoba fizyczna. Kontakt: <a href=\"mailto:mlynarski.mateusz@gmail.com\">mlynarski.mateusz@gmail.com</a>. Strona prezentuje aplikację przed premierą i nie umożliwia zakupu."], ["Działanie aplikacji", "Hiddie ukrywa zaznaczony, edytowalny tekst w aplikacjach obsługujących Usługi macOS i zapisuje oryginał w lokalnym Pęku kluczy. Odsłonięcie wymaga potwierdzenia tożsamości w systemie. Osobna funkcja zakrywa dane w eksportowanej kopii obrazu lub PDF. Wymagany jest macOS 14 lub nowszy. Obsługa Usług zależy od aplikacji źródłowej; skróty konfiguruje użytkownik."], ["Lokalność i utrata dostępu", "Znacznik nie jest kopią zapasową i nie umożliwia odczytu na innym urządzeniu. Brak synchronizacji, eksportu i odzyskiwania wpisów. Zachowuj niezależne, bezpieczne kopie ważnych informacji. Hiddie nie jest menedżerem haseł ani jedynym zalecanym miejscem przechowywania sekretów."], ["Odpowiedzialne korzystanie", "Używaj aplikacji wyłącznie do treści, które masz prawo przetwarzać. Przed udostępnieniem sprawdź całą wyeksportowaną kopię. Zakrycia nie usuwają informacji z oryginału, wcześniejszych wersji, innych kopii ani z niezaznaczonych obszarów. Hiddie nie zapewnia automatycznego wykrywania danych, OCR ani ochrony całego ekranu. PDF po eksporcie traci zaznaczalny tekst, formularze, załączniki i podpisy cyfrowe."], ["Zakup i licencja", "Planowany model to zakup jednorazowy, bez planu premium i subskrypcji. Finalną cenę, podatki i dostępność określi oferta sklepu. Zakup jednorazowy nie jest obietnicą wieczystego wsparcia ani wszystkich przyszłych produktów. Jeśli aplikacja będzie dystrybuowana w App Store, zastosowanie będą miały warunki transakcji Apple oraz wskazana przy zakupie licencja, w tym standardowa EULA Apple, jeżeli nie zostanie dostarczona odrębna licencja. Ten dokument nie zastępuje warunków sklepu."], ["Demo", "Demo jest bezpłatną symulacją edukacyjną. Nie używa lokalnego Pęku kluczy ani uwierzytelniania macOS i nie stanowi zabezpieczenia prawdziwych sekretów. Używaj danych fikcyjnych. Reset, przeładowanie lub zamknięcie karty usuwa tekst z pamięci demo. Pobierany PNG pokazuje zakrycie fikcyjnego dokumentu i nie jest eksportem rzeczywistego PDF przez aplikację."], ["Prawa konsumenta i odpowiedzialność", "Żadne postanowienie nie wyłącza ani nie ogranicza bezwzględnie obowiązujących praw konsumenta, w tym praw związanych ze zgodnością treści cyfrowej z umową i dostępnymi środkami ochrony. Zasady odstąpienia i zwrotów zależą od przepisów oraz okoliczności transakcji i warunków sklepu. Nie ustanawiamy ogólnego zakazu zwrotów. Odpowiedzialność za aplikację jest oceniana zgodnie z właściwymi przepisami; opis ograniczeń technicznych nie uchyla tych praw."], ["Kontakt i aktualizacje", "Pytania lub zgłoszenia problemów wyślij na adres kontaktowy bez poufnych treści. Warunki mogą być aktualizowane, aby odzwierciedlały zmiany aplikacji lub prawa. Aktualna wersja jest dostępna na tej stronie z datą. Nowe warunki nie pozbawiają praw już nabytych na podstawie obowiązujących przepisów."]]}, "en": {"title": "Terms of use", "sections": [["Scope", "These terms describe use of Hiddie for macOS and its browser demo. The app developer is Mateusz Młynarski, acting as an individual. Contact: <a href=\"mailto:mlynarski.mateusz@gmail.com\">mlynarski.mateusz@gmail.com</a>. This website presents the app before launch and does not offer purchases."], ["App functionality", "Hiddie hides selected, editable text in apps supporting macOS Services and stores the original in local Keychain. Revealing it requires system identity confirmation. A separate feature redacts exported copies of images or PDFs. macOS 14 or later is required. Services support depends on the source app; users configure shortcuts."], ["Local storage and lost access", "A marker is not a backup and cannot restore text on another device. Entry synchronization, export and recovery are unavailable. Keep independent, secure copies of important information. Hiddie is not a password manager or a recommended sole repository for secrets."], ["Responsible use", "Use the app only with content you have permission to process. Inspect the complete exported copy before sharing. Redaction does not remove information from the original, prior versions, other copies or uncovered areas. Hiddie does not provide automatic sensitive data detection, OCR or whole screen protection. Exported PDFs lose selectable text, forms, attachments and digital signatures."], ["Purchase and license", "The planned model is a one time purchase with no premium tier or subscription. Final pricing, taxes and availability will be shown in the store listing. A one time purchase does not promise perpetual support or access to every future product. If distributed through the App Store, Apple’s transaction terms and the license identified at purchase apply, including Apple’s standard EULA if no separate license is provided. These terms do not replace store terms."], ["Demo", "The demo is a free educational simulation. It uses neither local Keychain nor macOS authentication and does not protect real secrets. Use fictional data. Resetting, reloading or closing the tab removes text from demo memory. Downloaded PNGs illustrate redaction of a fictional document and are not actual PDF exports from the app."], ["Consumer rights and liability", "Nothing here excludes or limits mandatory consumer rights, including digital content conformity rights and applicable remedies. Withdrawal and refund rights depend on applicable law, transaction circumstances and store terms. These terms do not impose a blanket prohibition on refunds. Liability is determined by applicable law; technical limitations do not override these rights."], ["Contact and updates", "Send questions or issue reports to the contact address without confidential content. Terms may be updated to reflect changes to the app or the law. The current version is available here with its date. New terms do not remove rights already acquired under mandatory law."]]}};let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'pl';function render(){const d=data[lang];document.documentElement.lang=lang;document.title=d.title+' · Hiddie';document.querySelector('h1').textContent=d.title;document.querySelector('time').textContent=lang==='pl'?'Aktualizacja: 27 października 2026':'Updated: 27 October 2026';document.querySelector('#sections').innerHTML=d.sections.map(([t,p])=>'<section><h2>'+t+'</h2><p>'+p+'</p></section>').join('');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelector('#back').textContent=lang==='pl'?'← Strona Hiddie':'← Hiddie website';document.querySelector('#back').href='index.html?lang='+lang;document.querySelector('.brand').href='index.html?lang='+lang;const other=document.querySelector('#other');other.href='privacy.html?lang='+lang;other.textContent=lang==='pl'?'Polityka prywatności':'Privacy policy';}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;history.replaceState(null,'','?lang='+lang);render()});render();</script></body></html>
